# Included inside the HTTPS server after a trusted certificate is issued.
root /var/www/comssa-hackathon;
client_max_body_size 16m;
location = / { try_files /index.html =404; }
location = /index.html { try_files /index.html =404; }
location /assets/ { try_files $uri =404; }
location /webfonts/ { try_files $uri =404; }
location = /styles.css { try_files $uri =404; }
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_redirect off;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
}
