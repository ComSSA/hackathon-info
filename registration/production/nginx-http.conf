# Bootstrap HTTP listener. Only certificate validation is served over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name hackathon.comssa.org.au;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://hackathon.comssa.org.au$request_uri; }
}
